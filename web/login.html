<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · OpenCode Pool Gateway</title>
  <style>
    :root{--ink:#17211c;--muted:#718079;--line:#dfe7df;--bg:#f3f6f2;--green:#2d8a61;--red:#c75246}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}.login{width:min(390px,100%);padding:30px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 16px 44px #17211c12}.brand{display:flex;align-items:center;gap:11px;margin-bottom:28px}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;background:var(--ink);color:#b5e66d;font-size:20px;font-weight:800}.brand strong{display:block;font-size:17px}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:9px;letter-spacing:1.4px}h1{margin:0;font-size:24px}p{margin:8px 0 22px;color:var(--muted);font-size:12px;line-height:1.6}label{display:block;margin:15px 0 0;font-size:11px;font-weight:700}input{display:block;width:100%;height:42px;margin-top:7px;padding:0 11px;border:1px solid var(--line);border-radius:6px;outline:none;font:inherit;font-size:13px}input:focus{border-color:var(--green);box-shadow:0 0 0 3px #2d8a6112}button{width:100%;height:42px;margin-top:21px;border:0;border-radius:7px;background:var(--ink);color:#effbe7;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.error,.notice{margin:0 0 12px;padding:9px 10px;border-radius:5px;font-size:11px}.error{background:#fdecea;color:var(--red)}.notice{background:#edf7e9;color:var(--green)}.error:empty,.notice:empty{display:none}.note{display:block;margin-top:16px;color:#93a098;text-align:center;font-size:9px}
  </style>
</head>
<body>
  <main class="login">
    <div class="brand"><span class="mark">O</span><div><strong>OpenCode Pool Gateway</strong><small>ACCOUNT GATEWAY</small></div></div>
    <h1>登录控制台</h1>
    <p>验证身份后才能查看账号额度、模型目录和本地凭证状态。</p>
    <div class="notice">{{NOTICE}}</div>
    <div class="error">{{ERROR}}</div>
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{NEXT}}">
      <label>用户名<input name="username" autocomplete="username" required autofocus></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">登录</button>
    </form>
    <small class="note">会话将在 24 小时后失效</small>
  </main>
</body>
</html>
